# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.13.1"

[github]
jobs = [
   "qa",
   "dependencies",
   "release_ready",
   "circular",
]

[pyproject]
check_manifest_ignores = """
    "Makefile",
    "PLAN-*.md",
    "SPEC-*.md",
"""

[pre_commit]
# zpretty parses through lxml, and lxml 6 broke its namespace handling: with
# lxml 6.2.0 `zpretty --inplace` rewrites `<configure xmlns=...>` to
# `<configure>` and `<browser:page>` to `<page>`, which is not a reformat but
# a broken ZCML file. It surfaced as a QA failure on an unrelated commit
# because the hook environment is cached: the tree never changed, the
# resolved lxml did. Reported upstream; drop this when zpretty handles lxml 6.
zpretty_extra_lines = """
        additional_dependencies:
        -   "lxml<6"
"""

[tox]
test_matrix = {"6.2" = ["*"]}
test_environment_variables = """
    SENTRY_DISABLE=1
"""
envlist_lines = """
    zope
"""
extra_lines = """
[testenv:zope]
description = unit tests against plain Zope, without Plone installed
use_develop = true
skip_install = false
extras =
set_env = SENTRY_DISABLE=1
deps =
    zope.testrunner
    Products.SiteErrorLog
commands =
    zope-testrunner --test-path={toxinidir}/src -s collective.sentry -m 'collective\\.sentry\\.tests\\.(test_extraction|test_capture|test_integration|test_bootstrap|test_bbb|test_ratelimit|test_zodb|test_pii)' {posargs}
"""
